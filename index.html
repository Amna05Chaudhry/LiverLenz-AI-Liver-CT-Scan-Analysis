<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedAssist Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 flex items-center">
      <svg
        class="w-8 h-8 mr-2"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10l1.74 3.48A2 2 0 0118.82 17H5.18a2 2 0 01-1.92-2.52L5 11z"
        />
      </svg>
      <h1 class="text-2xl font-semibold">Liver Lens</h1>
    </div>

    <!-- Chat Window -->
    <div id="chatWindow" class="flex-grow p-4 overflow-y-auto space-y-4">
      <!-- Bot Welcome Message -->
      <div class="flex items-start">
        <div class="flex-shrink-0">
          <img
            class="w-10 h-10 rounded-full"
            src="https://i.ibb.co/PrfQ6XS/medical-bot.png"
            alt="Bot Avatar"
          />
        </div>
        <div
          class="ml-3 bg-blue-100 text-blue-800 p-3 rounded-lg max-w-xs w-full"
        >
          <p>Welcome to Liver Lens! How can I help you today?</p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-gray-300 bg-white">
      <form
        id="uploadForm"
        enctype="multipart/form-data"
        class="flex items-center space-x-2 mb-2"
      >
        <input
          type="file"
          name="file"
          id="fileInput"
          class="flex-1 text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
        />
        <button
          type="button"
          onclick="uploadImage()"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 focus:outline-none"
        >
          Upload Image
        </button>
      </form>
      <div class="flex items-center">
        <input
          id="messageInput"
          type="text"
          placeholder="Type your message..."
          class="flex-1 px-4 py-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
        />
        <button
          onclick="sendMessage()"
          class="bg-blue-600 text-white px-4 py-2 rounded-r-lg hover:bg-blue-700 focus:outline-none"
        >
          Send
        </button>
      </div>
    </div>

    <!-- JavaScript Code -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("messageInput")
          .addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
              event.preventDefault(); // Prevent form submission on Enter
              sendMessage();
            }
          });
      });

function uploadImage() {
    var form = document.getElementById('uploadForm');
    var formData = new FormData(form);
    var fileInput = document.getElementById('fileInput');
    
    if (!fileInput.value) {
        alert("Please select an image to upload.");
        return;
    }

    addMessage('user', 'Uploaded an image.');

    fetch('http://127.0.0.1:5000/upload', {
        method: 'POST',
        body: formData,
        headers: {
            'Accept': 'application/json',
        },
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        addMessage('bot', 'Image uploaded and analyzed.');

        // Process and display the extracted information
        if (data.extracted_info) {
            let extractedInfo;
            if (Array.isArray(data.extracted_info)) {
                extractedInfo = `
                    <div>
                        <p class="font-semibold mb-2">Extracted Information:</p>
                        ${data.extracted_info.map((info, index) => `
                            <p class="font-semibold">Finding ${index + 1}:</p>
                            <ul class="list-disc list-inside mb-2">
                                <li><strong>Area:</strong> ${info.area} mm²</li>
                                <li><strong>Bounding Box:</strong> ${info.bounding_box}</li>
                                <li><strong>Centroid:</strong> ${info.centroid}</li>
                            </ul>
                        `).join('')}
                    </div>
                `;
            } else {
                extractedInfo = `
                    <div>
                        <p class="font-semibold mb-2">Extracted Information:</p>
                        <p class="font-semibold">Finding 1:</p>
                        <ul class="list-disc list-inside mb-2">
                            <li><strong>Area:</strong> ${data.extracted_info.area} mm²</li>
                            <li><strong>Bounding Box:</strong> ${data.extracted_info.bounding_box}</li>
                            <li><strong>Centroid:</strong> ${data.extracted_info.centroid}</li>
                        </ul>
                    </div>
                `;
            }
            addMessage('bot', extractedInfo);
        }

        // Process and display the detailed interpretation
        if (data.response) {
            const formattedResponse = formatDetailedInterpretation(data.response);
            addMessage('bot', formattedResponse);
        }

        var chatWindow = document.getElementById('chatWindow');

        var imgBubble = document.createElement('div');
        imgBubble.classList.add('flex', 'items-start', 'space-x-3');
        imgBubble.innerHTML = `
            <div class="flex-shrink-0">
                <img class="w-10 h-10 rounded-full" src="https://i.ibb.co/PrfQ6XS/medical-bot.png" alt="Bot Avatar">
            </div>
            <div class="space-y-2 max-w-xs w-full">
                <div class="bg-blue-100 text-blue-800 p-3 rounded-lg">
                    <p class="font-semibold mb-2">Result Image:</p>
                    <img src="http://127.0.0.1:5000/get_image?path=${data.result_image}" alt="Result Image" class="rounded-lg max-w-full h-auto">
                </div>
                <div class="bg-blue-100 text-blue-800 p-3 rounded-lg">
                    <p class="font-semibold mb-2">Bounding Box Result Image:</p>
                    <img src="http://127.0.0.1:5000/get_image?path=${data.bbox_result_image}" alt="Bounding Box Result Image" class="rounded-lg max-w-full h-auto">
                </div>
            </div>
        `;
        chatWindow.appendChild(imgBubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // Reset the file input
        fileInput.value = "";
    })
    .catch(error => {
        console.error('Error:', error);
        addMessage('bot', 'Failed to upload and analyze the image.');
    });
}


      function formatDetailedInterpretation(response) {
        const formattedResponse = response
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") // Bold
          .replace(/\*(.*?)\*/g, "<em>$1</em>") // Italic
          .replace(/\n/g, "<br>") // Line breaks
          .replace(/1\.\s/g, "<br>1. ") // Fix numbering after line breaks
          .replace(/2\.\s/g, "<br>2. ") // Fix numbering after line breaks
          .replace(/3\.\s/g, "<br>3. ") // Fix numbering after line breaks
          .replace(/4\.\s/g, "<br>4. ") // Fix numbering after line breaks
          .replace(/5\.\s/g, "<br>5. ") // Fix numbering after line breaks
          .replace(/\*\*\*\* (.*?) \*\*\*\*/g, "<h4>$1</h4>") // Custom headers for emphasis
          .replace(/\*\*\* (.*?) \*\*\*/g, "<h3>$1</h3>") // Custom headers for emphasis
          .replace(/\*\* (.*?) \*\*/g, "<h2>$1</h2>") // Custom headers for emphasis
          .replace(/\* (.*?) \*/g, "<h1>$1</h1>"); // Custom headers for emphasis

        return formattedResponse;
      }

      function sendMessage() {
    var message = document.getElementById('messageInput').value;
    if (!message.trim()) return;

    addMessage('user', message);
    document.getElementById('messageInput').value = '';

    fetch('http://127.0.0.1:5000/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ message: message }),
    })
    .then(response => response.json())
    .then(data => {
        // Format the response before displaying it
        const formattedResponse = formatDetailedInterpretation(data.response);
        addMessage('bot', formattedResponse);
    })
    .catch(error => console.error('Error:', error));
}


      function addMessage(sender, message) {
        var chatWindow = document.getElementById("chatWindow");
        var messageBubble = document.createElement("div");

        if (sender === "user") {
          messageBubble.classList.add(
            "flex",
            "items-end",
            "justify-end",
            "space-x-3"
          );
          messageBubble.innerHTML = `
                    <div class="bg-green-100 text-green-800 p-3 rounded-lg max-w-xs w-full">
                        ${message}
                    </div>
                    <div class="flex-shrink-0">
                        <img class="w-10 h-10 rounded-full" src="https://i.ibb.co/HC6VL9x/user-avatar.png" alt="User Avatar">
                    </div>
                `;
        } else {
          messageBubble.classList.add("flex", "items-start", "space-x-3");
          messageBubble.innerHTML = `
                    <div class="flex-shrink-0">
                        <img class="w-10 h-10 rounded-full" src="https://i.ibb.co/PrfQ6XS/medical-bot.png" alt="Bot Avatar">
                    </div>
                    <div class="bg-blue-100 text-blue-800 p-3 rounded-lg max-w-xs w-full">
                        ${message}
                    </div>
                `;
        }

        chatWindow.appendChild(messageBubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    </script>
  </body>
</html>
